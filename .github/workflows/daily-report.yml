name: daily-report
on:
  schedule:
    - cron: "10 22 * * *"   # UTC 22:10 = KST 07:10 시작 → 통상 07:15~07:40 사이 수신 (GitHub 사정으로 드물게 지연 가능)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
      - run: pip install -r requirements.txt
      - name: Build & send report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          MUNPIA_JSON_URL: ${{ secrets.MUNPIA_JSON_URL }}
          MUNPIA_TOKEN: ${{ secrets.MUNPIA_TOKEN }}
        run: python scripts/daily_report.py
      - name: Commit state
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state
          git commit -m "report $(date -u +'%Y-%m-%d')" || echo "no changes"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || (git pull --rebase origin ${GITHUB_REF_NAME} && git push)
